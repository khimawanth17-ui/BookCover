
<!DOCTYPE html>
<html>
<head>
    <title>Book Cover</title>

    <style>
        body {
            background: #e8e8e8;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .book {
            width: 320px;
            height: 450px;
            background: linear-gradient(135deg, #172554, #2563eb);
            color: white;
            text-align: center;
            padding: 25px;
            box-sizing: border-box;
            box-shadow: 5px 8px 20px gray;
            border-radius: 5px;
        }

        h1 {
            margin-top: 80px;
            font-size: 32px;
        }

        p {
            font-size: 16px;
        }

        .author {
            margin-top: 100px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="book">
        <h1>THE WORLD OF Python</h1>

        <p>Learn Coding and Technology</p>

        <p class="author">By Guido Van Rossum</p>
    </div>

</body>
</html>
